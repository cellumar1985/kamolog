<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>かもろぐ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
   
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

 body {
position: relative;
  z-index: 10;
      font-family: sans-serif;
      padding: 10px;

      background:#D7EEFF;
      background-repeat: repeat-y;
      background-position: center top;
      background-size: 100% auto;
         }

    @keyframes riverFlow {
      from { background-position: 0 0; }
      to   { background-position: 0 2000px; }
    }

    input, button {
      display: block;
      margin: 8px 0;
      font-size: 16px;
    }

    img {
      max-width: 100%;
      margin-top: 5px;
    }

    .record {
      border-bottom: 1px solid #ccc;
      padding: 8px 0;
    }

    .btns {
      display: flex;
      gap: 10px;
    }

label {
  font-weight: bold;
  margin-top: 10px;
  display: block;
}

input, textarea {
  width: 100%;
  padding: 8px;
  box-sizing: border-box;
}


#duck2 {
  position: fixed;
  top: -120px;
  width: 100px;
  max-width: none;
  pointer-events: none;
  z-index: 1;
  animation: flow 25s linear infinite;
}


#app {
  position: relative;
  z-index: 10;
}
 
@keyframes flow {
  0%   { top: -120px; }
  100% { top: 110vh; }
}


@keyframes wobble {
  0%   { margin-left: -5px; }
  50%  { margin-left: 5px; }
  100% { margin-left: -5px; }
}


@media(min-width: 768px) {
  #duck2 {
    width: 330px;
  }
}
 
.logo{
  width: 300px;
  max-width: 80%;
  height: auto;
}

h1{
  text-align:center;
}

.topbar{
  padding:12px 0;
  text-align:center;
  
}


 </style>
</head>

<body>

<img src="duck2.png" id="duck2">

<div id="app">

<header class="topbar">
  <img src="geminilogo.jpg" alt="かもろぐ" class="logo">
</header>



 

  <label>🦆 カーモの種類</label>
<input type="text" id="kamo">

<label>📅 日付</label>
<input type="date" id="date">

<label>📍 場所</label>
<input type="text" id="place">

<label>📝 カモメモ</label>
<textarea id="memo"></textarea>

<label>📷 写真</label>
<input type="file" id="photo" accept="image/*" onchange="previewImage()">

<img id="preview" style="max-width:100%; display:none; margin-top:10px;">

  <button onclick="saveRecord()">保存</button>

  <hr>

<select id="filterKamo" onchange="applyFilter()">
  <option value="">全部のカーモ</option>
</select>


<select id="filterPlace" onchange="applyFilter()">
  <option value="">全部の場所</option>
</select>


<select id="sortOrder" onchange="applyFilter()">
  <option value="desc">新しい順</option>
  <option value="asc">古い順</option>
</select>

  <div id="recordList"></div>



  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC_Qi-AMJBo0ZY0dYn2KOLPALdkuq4zjJ4",
      authDomain: "kamolog-537fd.firebaseapp.com",
      projectId: "kamolog-537fd",
      storageBucket: "kamolog-537fd.firebasestorage.app",
      messagingSenderId: "855371003036",
      appId: "1:855371003036:web:3364d4727964e3bccf2959"
    };


firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentPhoto = null;


let allData = [];
let editId = null;


    function saveRecord() {
      const kamoInput = document.getElementById("kamo");
      const placeInput = document.getElementById("place");
      const photoInput = document.getElementById("photo");

const kamo = kamoInput.value;
const place = placeInput.value;
const memo = document.getElementById("memo").value || "";
const date = document.getElementById("date").value;
     const file = photoInput.files[0];

      

      if (!kamo || !place) {
        alert("カーモと場所は必須だよ🦆");
        return;
      }

      if (file) {
        compressImage(file, function(base64) {
          saveToFirestore(kamo, place, memo, date, base64);
        });
      } else {
        saveToFirestore(kamo, place, memo, date, currentPhoto);
      }
    }

    function saveToFirestore(kamo, place, memo, date, photo){

  if(editId){

    let updateData = { kamo, place, memo, date };

    if(photo){
      updateData.photo = photo;
    }

    db.collection("kamolog").doc(editId).update(updateData);

    editId = null;
    currentPhoto = null;

  }else{

    db.collection("kamolog").add({
      kamo, place, memo, date, photo,
      created: Date.now()
    });

  }

  clearForm();
}

 db.collection("kamolog").onSnapshot(snapshot => {

  allData = [];

  snapshot.forEach(doc => {
    allData.push({
      id: doc.id,
      ...doc.data()
    });
  });

  updateFilterOptions();
  applyFilter();
});


function updateFilterOptions(){

  const kamoSelect = document.getElementById("filterKamo");
  const placeSelect = document.getElementById("filterPlace");

  kamoSelect.innerHTML = `<option value="">全部のカーモ</option>`;
  placeSelect.innerHTML = `<option value="">全部の場所</option>`;

  const kamoSet = new Set();
  const placeSet = new Set();

  allData.forEach(d => {
    if(d.kamo) kamoSet.add(d.kamo);
    if(d.place) placeSet.add(d.place);
  });

  kamoSet.forEach(kamo => {
    const opt = document.createElement("option");
    opt.value = kamo;
    opt.textContent = kamo;
    kamoSelect.appendChild(opt);
  });

  placeSet.forEach(place => {
    const opt = document.createElement("option");
    opt.value = place;
    opt.textContent = place;
    placeSelect.appendChild(opt);
  });
}


const img1 = new Image();
img1.src = "duck2.png";
const img2 = new Image();
img2.src = "hina.png";


function applyFilter(){

  const kamoFilter = document.getElementById("filterKamo").value;
  const placeFilter = document.getElementById("filterPlace").value;
  const sort = document.getElementById("sortOrder").value;

  let data = [...allData];

  if(kamoFilter){
    data = data.filter(d => d.kamo.includes(kamoFilter));
  }

  if(placeFilter){
    data = data.filter(d => d.place.includes(placeFilter));
  }

  data.sort((a,b)=>{
    return sort==="asc"
      ? (a.date||"").localeCompare(b.date||"")
      : (b.date||"").localeCompare(a.date||"");
  });

  render(data);
}




function render(data){

  const list = document.getElementById("recordList");
  list.innerHTML = "";

  data.forEach(d=>{

    const div = document.createElement("div");
    div.className="record";

    div.innerHTML = `
      <p>📅 ${d.date||""}</p>
      <p>🦆 ${d.kamo} / 📍 ${d.place}</p>
      <p>${(d.memo||"").replace(/\n/g,"<br>")}</p>
       ${d.photo ? `<img src="${d.photo}">` : ""}
      <button onclick="editRecord('${d.id}')">編集</button>
      <button onclick="deleteRecord('${d.id}')">削除</button>
    `;

    list.appendChild(div);
  });
}

 function deleteRecord(id) {
      if (confirm("このカーモ記録を削除する？🗑️")) {
        db.collection("kamolog").doc(id).delete();
      }
    }


  function editRecord(id){

  const data = allData.find(d=>d.id===id);

  document.getElementById("kamo").value = data.kamo;
  document.getElementById("place").value = data.place;
  document.getElementById("memo").value = data.memo||"";
  document.getElementById("date").value = data.date||"";

  currentPhoto = data.photo || null;

  editId = id;


    alert("編集モードだよ🦆");
}

  function clearForm() {
  document.getElementById("kamo").value = "";
  document.getElementById("place").value = "";
  document.getElementById("memo").value = "";
  document.getElementById("date").value = "";
  document.getElementById("photo").value = "";

  const preview = document.getElementById("preview");
  preview.src = "";
  preview.style.display = "none";

  currentPhoto = null;
  editId = null;
}

   function compressImage(file, callback){
  const reader = new FileReader();

  reader.onload = function(e){
    const img = new Image();

    img.onload = function(){
      const canvas = document.createElement("canvas");
      const maxSize = 800;

      let w = img.width;
      let h = img.height;

      if(w > h && w > maxSize){
        h *= maxSize / w;
        w = maxSize;
      }else if(h > maxSize){
        w *= maxSize / h;
        h = maxSize;
      }

      canvas.width = w;
      canvas.height = h;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(img,0,0,w,h);

      callback(canvas.toDataURL("image/jpeg",0.7));
    };

    img.src = e.target.result;
  };

  reader.readAsDataURL(file);
}

function previewImage() {
  const file = document.getElementById("photo").files[0];
  const preview = document.getElementById("preview");

  if (file) {
    const reader = new FileReader();

    reader.onload = function(e) {
      preview.src = e.target.result;
      preview.style.display = "block";
    };

    reader.readAsDataURL(file);
  }
}



const duck = document.getElementById("duck2");

function startFlow() {

  // ランダム位置
  const left = Math.random() * 80;
  duck.style.left = left + "%";

  // ランダム種類
  const isBaby = Math.random() < 0.2;

  let duration;
  let animationText;

  if (isBaby) {
    duck.src = "hina.png";
    duck.style.width = "80px"; // 小さく
    duration = 2;
    animationText = `flow ${duration}s linear 1, wobble 0.1s ease-in-out infinite`;


  } else {
    duck.src = "duck2.png";
    duck.style.width = "180px"; // 普通サイズ
    duration = 12;

    animationText = `flow ${duration}s linear 1`;
  }

  // アニメーション完全リセット
  duck.style.animation = "none";
  duck.offsetHeight; // ←これ超重要

// durationも含めて再設定
  duck.style.animation = animationText;
}


  duck.addEventListener("animationend",(e)=>{
  if(e.animationName==="flow"){  
startFlow();
}
});


// 開始
startFlow();

window.onload = function(){
  startFlow();
};



  </script>

</body>
</html>
