<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>kamolog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: sans-serif;
      padding: 10px;
    }
    input, button {
      display: block;
      margin: 8px 0;
      font-size: 16px;
    }
    img {
      max-width: 100%;
      margin-top: 5px;
    }
    .record {
      border-bottom: 1px solid #ccc;
      padding: 8px 0;
    }
    .btns {
      display: flex;
      gap: 10px;
    }
  </style>


</head>

<body>

  <h1>🦆 カモログ</h1>

  <input type="text" id="kamo" placeholder="カーモの名前（例：カルガーモ）">
  <input type="text" id="place" placeholder="場所（例：あづま運動公園）">
  <input type="file" id="photo" accept="image/*">

  <button onclick="saveRecord()">保存</button>

  <hr>

  <div id="recordList"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import {
      getFirestore, collection, addDoc, onSnapshot,
      deleteDoc, doc, updateDoc
    } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC_Qi-AMJBo0ZY0dYn2KOLPALdkuq4zjJ4",
      authDomain: "kamolog-537fd.firebaseapp.com",
      projectId: "kamolog-537fd",
      storageBucket: "kamolog-537fd.firebasestorage.app",
      messagingSenderId: "855371003036",
      appId: "1:855371003036:web:3364d4727964e3bccf2959"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const kamoInput = document.getElementById("kamo");
    const placeInput = document.getElementById("place");
    const photoInput = document.getElementById("photo");
    const recordList = document.getElementById("recordList");

    let editId = null;

    window.saveRecord = async function () {
      const kamo = kamoInput.value;
      const place = placeInput.value;
      const file = photoInput.files[0];

      if (!kamo || !place) {
        alert("カーモと場所は必須だよ🦆");
        return;
      }

      if (file) {
        const reader = new FileReader();
        reader.onload = async function () {
          await saveToFirestore(kamo, place, reader.result);
        };
        reader.readAsDataURL(file);
      } else {
        await saveToFirestore(kamo, place, null);
      }
    };

    async function saveToFirestore(kamo, place, photo) {
      if (editId) {
        await updateDoc(doc(db, "kamolog", editId), {
          kamo, place, photo
        });
        editId = null;
      } else {
        await addDoc(collection(db, "kamolog"), {
          kamo, place, photo, created: Date.now()
        });
      }
      clearForm();
    }

    onSnapshot(collection(db, "kamolog"), (snapshot) => {
      recordList.innerHTML = "";
      snapshot.docs.forEach(docSnap => {
        const data = docSnap.data();
        const div = document.createElement("div");
        div.className = "record";
        div.innerHTML = `
          <p>🦆 ${data.kamo} / 📍 ${data.place}</p>
          ${data.photo ? `<img src="${data.photo}">` : ""}
          <div class="btns">
            <button onclick="editRecord('${docSnap.id}', '${data.kamo}', '${data.place}', '${data.photo || ""}')">編集</button>
            <button onclick="deleteRecord('${docSnap.id}')">削除</button>
          </div>
        `;
        recordList.appendChild(div);
      });
    });

    window.deleteRecord = async function (id) {
      if (confirm("このカーモ記録を削除する？🗑️")) {
        await deleteDoc(doc(db, "kamolog", id));
      }
    };

    window.editRecord = function (id, kamo, place, photo) {
      kamoInput.value = kamo;
      placeInput.value = place;
      editId = id;
      alert("編集モードになったよ🦆\n内容を直して保存してね！");
    };

    function clearForm() {
      kamoInput.value = "";
      placeInput.value = "";
      photoInput.value = "";
    }
  </script>

</body>
</html>
