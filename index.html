<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>kamolog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
   
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

 body {
position: relative;
  z-index: 10;
      font-family: sans-serif;
      padding: 10px;

      background-image: url("river_bg3.png");
      background-repeat: repeat-y;
      background-position: center top;
      background-size: 100% auto;
         }

    @keyframes riverFlow {
      from { background-position: 0 0; }
      to   { background-position: 0 2000px; }
    }

    input, button {
      display: block;
      margin: 8px 0;
      font-size: 16px;
    }

    img {
      max-width: 100%;
      margin-top: 5px;
    }

    .record {
      border-bottom: 1px solid #ccc;
      padding: 8px 0;
    }

    .btns {
      display: flex;
      gap: 10px;
    }


#duck2 {
  position: fixed;
  top: -120px;
  left: 50%;
  width: 100px;
  max-width: none;
  transform: translateX(-50%);
 pointer-events: none;
  z-index: 1;
  animation: flow 12s linear infinite;
}

#app {
  position: relative;
  z-index: 10;
}
 
@keyframes flow {
  0%   { top: -120px; }
  100% { top: 110vh; }
}


@media(min-width: 768px) {
  #duck2 {
    width: 330px;
  }
}
  </style>
</head>

<body>

<img src="duck2.png" id="duck2">

<div id="app">

  <h1>🦆 カモログ</h1>

  <input type="text" id="kamo" placeholder="カーモの名前（例：カルガーモ）">
  <input type="text" id="place" placeholder="場所（例：あづま運動公園）">
  <input type="file" id="photo" accept="image/*">
  <button onclick="saveRecord()">保存</button>

  <hr>

  <div id="recordList"></div>

</div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC_Qi-AMJBo0ZY0dYn2KOLPALdkuq4zjJ4",
      authDomain: "kamolog-537fd.firebaseapp.com",
      projectId: "kamolog-537fd",
      storageBucket: "kamolog-537fd.firebasestorage.app",
      messagingSenderId: "855371003036",
      appId: "1:855371003036:web:3364d4727964e3bccf2959"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const kamoInput = document.getElementById("kamo");
    const placeInput = document.getElementById("place");
    const photoInput = document.getElementById("photo");
    const recordList = document.getElementById("recordList");

    let editId = null;
    let currentPhoto = null;

    function saveRecord() {
      const kamo = kamoInput.value;
      const place = placeInput.value;
      const file = photoInput.files[0];

      if (!kamo || !place) {
        alert("カーモと場所は必須だよ🦆");
        return;
      }

      if (file) {
        compressImage(file, function(base64) {
          saveToFirestore(kamo, place, base64);
        });
      } else {
        saveToFirestore(kamo, place, currentPhoto);
      }
    }

    function saveToFirestore(kamo, place, photo) {
      if (editId) {
        db.collection("kamolog").doc(editId).update({
          kamo, place, photo
        });
        editId = null;
        currentPhoto = null;
      } else {
        db.collection("kamolog").add({
          kamo, place, photo, created: Date.now()
        });
      }
      clearForm();
    }

    db.collection("kamolog").orderBy("created", "desc")
      .onSnapshot(snapshot => {
        recordList.innerHTML = "";
        snapshot.forEach(doc => {
          const data = doc.data();
          const div = document.createElement("div");
          div.className = "record";
          div.innerHTML = `
            <p>🦆 ${data.kamo} / 📍 ${data.place}</p>
            ${data.photo ? `<img src="${data.photo}">` : ""}
            <div class="btns">
              <button onclick="editRecord('${doc.id}', '${data.kamo}', '${data.place}', '${data.photo || ""}')">編集</button>
              <button onclick="deleteRecord('${doc.id}')">削除</button>
            </div>
          `;
          recordList.appendChild(div);
        });
      });

    function deleteRecord(id) {
      if (confirm("このカーモ記録を削除する？🗑️")) {
        db.collection("kamolog").doc(id).delete();
      }
    }

    function editRecord(id, kamo, place, photo) {
      kamoInput.value = kamo;
      placeInput.value = place;
      currentPhoto = photo || null;
      editId = id;
      alert("編集モードだよ🦆\n文字だけ直しても写真は残るよ！");
    }

    function clearForm() {
      kamoInput.value = "";
      placeInput.value = "";
      photoInput.value = "";
    }

    function compressImage(file, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const maxSize = 800;

          let width = img.width;
          let height = img.height;

          if (width > height && width > maxSize) {
            height *= maxSize / width;
            width = maxSize;
          } else if (height > maxSize) {
            width *= maxSize / height;
            height = maxSize;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          callback(canvas.toDataURL("image/jpeg", 0.7));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  </script>

</body>
</html>
